[build-system]
# Standard setuptools packaging is sufficient for this small application.
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'fluids'
version = '0.1.0'
description = 'A native GPU coastal-wave sandbox'
readme = 'README.md'
requires-python = '>=3.11,<3.12'
# These pins establish a baseline to verify, not a claim of latest versions.
dependencies = ['taichi==1.7.4', 'numpy==1.26.4']

[project.optional-dependencies]
dev = ['pytest>=8']

[project.scripts]
fluids = 'fluids.__main__:main'

[tool.setuptools.packages.find]
include = ['fluids*']

[tool.pytest.ini_options]
testpaths = ['tests']
